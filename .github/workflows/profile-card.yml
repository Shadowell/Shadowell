name: Update Paper profile snapshot

on:
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/strategy/**', 'scripts/capture_profile_card.py', '.github/workflows/profile-card.yml']

permissions:
  contents: write

concurrency:
  group: paper-profile-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_profile_card.py
      - name: Publish snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bitpro-paper-performance.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update Paper performance snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
